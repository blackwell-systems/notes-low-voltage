<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Resistor network on a 10 volt source. Left mesh: a 2 ohm resistor on the top wire and a 3 ohm on the bottom wire, with a 10 ohm resistor vertically in the middle. Right mesh: a 1 ohm on the top and a 3 ohm on the bottom, with a 6 ohm resistor vertically on the right.">
  <rect x="6" y="6" width="748" height="418" rx="16" fill="#1a2130" stroke="#33405a"/>
  <text x="400" y="42" text-anchor="middle" fill="#e8edf5" font-size="20" font-weight="700">What total resistance does the 10 V source see?</text>

  <!-- wires -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="120" y1="150" x2="620" y2="150"/>       <!-- top -->
    <line x1="120" y1="350" x2="620" y2="350"/>       <!-- bottom -->
    <line x1="120" y1="150" x2="120" y2="238"/>       <!-- left upper -->
    <line x1="120" y1="262" x2="120" y2="350"/>       <!-- left lower -->
    <line x1="380" y1="150" x2="380" y2="350"/>       <!-- middle -->
    <line x1="620" y1="150" x2="620" y2="350"/>       <!-- right -->
  </g>
  <!-- battery 10 V -->
  <line x1="100" y1="238" x2="140" y2="238" stroke="#f5b342" stroke-width="3"/>
  <line x1="108" y1="262" x2="132" y2="262" stroke="#f5b342" stroke-width="7"/>
  <text x="58" y="254" text-anchor="middle" fill="#f5b342" font-size="14" font-weight="700" transform="rotate(-90 58 254)">10 VOLTS</text>

  <!-- resistors -->
  <g fill="#232c3f" stroke="#cfe0ff" stroke-width="2">
    <rect x="203" y="141" width="54" height="18" rx="2"/>   <!-- 2 top-left -->
    <rect x="473" y="141" width="54" height="18" rx="2"/>   <!-- 1 top-right -->
    <rect x="203" y="341" width="54" height="18" rx="2"/>   <!-- 3 bottom-left -->
    <rect x="473" y="341" width="54" height="18" rx="2"/>   <!-- 3 bottom-right -->
    <rect x="371" y="223" width="18" height="54" rx="2"/>   <!-- 10 middle -->
    <rect x="611" y="223" width="18" height="54" rx="2"/>   <!-- 6 right -->
  </g>
  <g fill="#e8edf5" font-size="14" font-weight="600">
    <text x="230" y="131" text-anchor="middle">2 &#8486;</text>
    <text x="500" y="131" text-anchor="middle">1 &#8486;</text>
    <text x="230" y="376" text-anchor="middle">3 &#8486;</text>
    <text x="500" y="376" text-anchor="middle">3 &#8486;</text>
    <text x="404" y="255" text-anchor="start">10 &#8486;</text>
    <text x="644" y="255" text-anchor="start">6 &#8486;</text>
  </g>

  <text x="400" y="408" text-anchor="middle" fill="#94a3b8" font-size="12.5">Collapse the series and parallel groups down to one value.</text>
</svg>
