<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Series vs parallel circuits. Series: one loop with resistors in a line, same current everywhere, resistances add. Parallel: resistors on separate branches between two rails, same voltage across each, reciprocals add.">
  <rect x="6" y="6" width="748" height="418" rx="16" fill="#1a2130" stroke="#33405a"/>
  <text x="380" y="38" text-anchor="middle" fill="#e8edf5" font-size="21" font-weight="700">Series vs parallel circuits</text>
  <line x1="380" y1="70" x2="380" y2="352" stroke="#33405a" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="200" y="92" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="700">SERIES</text>
  <text x="575" y="92" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="700">PARALLEL</text>

  <!-- ===== SERIES (one loop) ===== -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="80" y1="150" x2="320" y2="150"/>       <!-- top -->
    <line x1="320" y1="150" x2="320" y2="300"/>      <!-- right -->
    <line x1="320" y1="300" x2="80" y2="300"/>       <!-- bottom -->
    <line x1="80" y1="150" x2="80" y2="206"/>        <!-- left upper -->
    <line x1="80" y1="222" x2="80" y2="300"/>        <!-- left lower -->
  </g>
  <!-- battery -->
  <line x1="64" y1="206" x2="96" y2="206" stroke="#f5b342" stroke-width="3"/>
  <line x1="72" y1="222" x2="88" y2="222" stroke="#f5b342" stroke-width="7"/>
  <text x="34" y="219" text-anchor="middle" fill="#f5b342" font-size="12" font-weight="700">V</text>
  <!-- resistors in a line on the top wire -->
  <g>
    <rect x="118" y="141" width="44" height="18" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <rect x="178" y="141" width="44" height="18" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <rect x="238" y="141" width="44" height="18" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <text x="140" y="131" text-anchor="middle" fill="#e8edf5" font-size="12">R1</text>
    <text x="200" y="131" text-anchor="middle" fill="#e8edf5" font-size="12">R2</text>
    <text x="260" y="131" text-anchor="middle" fill="#e8edf5" font-size="12">R3</text>
  </g>
  <!-- single-loop current arrow -->
  <path d="M182 300 l-14 -6 l0 12 z" fill="#60a5fa"/>
  <text x="200" y="330" text-anchor="middle" fill="#94a3b8" font-size="12.5">One path · same current everywhere</text>
  <text x="200" y="349" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="600">R_total = R1 + R2 + R3</text>

  <!-- ===== PARALLEL (branches) ===== -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="450" y1="150" x2="690" y2="150"/>      <!-- top rail -->
    <line x1="450" y1="300" x2="690" y2="300"/>      <!-- bottom rail -->
    <line x1="450" y1="150" x2="450" y2="206"/>      <!-- left upper -->
    <line x1="450" y1="222" x2="450" y2="300"/>      <!-- left lower -->
    <line x1="530" y1="150" x2="530" y2="200"/><line x1="530" y1="242" x2="530" y2="300"/>
    <line x1="590" y1="150" x2="590" y2="200"/><line x1="590" y1="242" x2="590" y2="300"/>
    <line x1="650" y1="150" x2="650" y2="200"/><line x1="650" y1="242" x2="650" y2="300"/>
  </g>
  <!-- battery -->
  <line x1="434" y1="206" x2="466" y2="206" stroke="#f5b342" stroke-width="3"/>
  <line x1="442" y1="222" x2="458" y2="222" stroke="#f5b342" stroke-width="7"/>
  <text x="414" y="219" text-anchor="middle" fill="#f5b342" font-size="12" font-weight="700">V</text>
  <!-- branch resistors -->
  <g>
    <rect x="521" y="200" width="18" height="42" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <rect x="581" y="200" width="18" height="42" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <rect x="641" y="200" width="18" height="42" rx="2" fill="#232c3f" stroke="#cfe0ff" stroke-width="2"/>
    <text x="530" y="140" text-anchor="middle" fill="#e8edf5" font-size="12">R1</text>
    <text x="590" y="140" text-anchor="middle" fill="#e8edf5" font-size="12">R2</text>
    <text x="650" y="140" text-anchor="middle" fill="#e8edf5" font-size="12">R3</text>
  </g>
  <text x="572" y="330" text-anchor="middle" fill="#94a3b8" font-size="12.5">Many paths · same voltage across each</text>
  <text x="572" y="349" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="600">1/R_total = 1/R1 + 1/R2 + 1/R3</text>

  <text x="380" y="404" text-anchor="middle" fill="#94a3b8" font-size="13">Adding resistors in series raises total resistance; in parallel it lowers it.</text>
</svg>
